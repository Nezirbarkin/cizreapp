  <style>
    /* Body ve html için tam ekran - scroll kaymasını engelle */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
    }
    
    /* Flutter canvas container için */
    #flutter-view {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    
    /* Touch ve scroll davranışını kontrol et */
    * {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
    
    /* Input ve textarea için seçimi aktif et */
    input, textarea {
      -webkit-user-select: text;
      -khtml-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
      user-select: text;
    }
    
    /* Yükleme göstergesi */
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, #1ABC9C 0%, #16A085 50%, #2C3E50 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #loading.hidden {
      display: none;
    }
    .loading-logo {
      font-size: 48px;
      font-weight: 900;
      color: white;
      margin-bottom: 20px;
      letter-spacing: 3px;
    }
    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;

    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      color: rgba(255, 255, 255, 0.9);

    /* Hata mesajı */
    #error {
      display: none;

      padding: 20px;
      text-align: center;
      box-sizing: border-box;
    }
    #error.show {
      display: flex;
    }
    #error h2 {
      margin-bottom: 10px;
    }
    #error button {
      margin-top: 20px;
      padding: 10px 20px;
      background: #721c24;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>

  <!-- TANITIM (PROMO) EKRANI                                                -->
  <!-- Flutter bundle'ı beklemeden ilk boyada görünen açılış ekranı.         -->
  <!-- İçerik admin panelinden yönetilir: Admin Panel > Tanıtım Videosu (Web)-->
  <!-- Ayarlar Supabase `app_settings` tablosundaki web_promo_* anahtarları. -->
  <!-- ===================================================================== -->
  <style id="promo-style">
    #promo {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-y: auto;
      overscroll-behavior: contain;
      background: #04110d;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      opacity: 1;
      transition: opacity .45s ease;
    }
    #promo[hidden] { display: none; }
    #promo.promo-leaving { opacity: 0; pointer-events: none; }

    /* --- Arka plan sahnesi (video ya da animasyonlu marka sahnesi) --- */
    .promo-stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #04110d;
    }
    #promo-video, #promo-poster {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    #promo.has-video #promo-video { display: block; }
    #promo.has-poster #promo-poster { display: block; }
    #promo.has-video #promo-poster { display: none; }
    #promo.has-video #promo-motion,
    #promo.has-poster #promo-motion { display: none; }

    /* Metnin her koşulda okunur kalması için katmanlı karartma */
    .promo-scrim {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(120% 90% at 50% 40%, rgba(4,17,13,.15) 0%, rgba(4,17,13,.72) 62%, rgba(4,17,13,.92) 100%),
        linear-gradient(180deg, rgba(4,17,13,.75) 0%, rgba(4,17,13,.25) 30%, rgba(4,17,13,.55) 70%, rgba(4,17,13,.95) 100%);
    }

    /* --- Videosuz durumda gösterilen animasyonlu marka sahnesi --- */
    #promo-motion { position: absolute; inset: 0; overflow: hidden; }
    #promo-motion .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: .55;
      animation: promo-drift 18s ease-in-out infinite;
    }
    #promo-motion .b1 { width: 60vmax; height: 60vmax; left: -18vmax; top: -22vmax; background: #00C853; }
    #promo-motion .b2 { width: 52vmax; height: 52vmax; right: -16vmax; top: 8vmax;  background: #00A0B0; animation-delay: -6s; }
    #promo-motion .b3 { width: 46vmax; height: 46vmax; left: 22vmax;  bottom: -20vmax; background: #0F7B5A; animation-delay: -12s; }
    @keyframes promo-drift {
      0%, 100% { transform: translate3d(0,0,0) scale(1); }
      33%      { transform: translate3d(4vmax, -3vmax, 0) scale(1.08); }
      66%      { transform: translate3d(-3vmax, 4vmax, 0) scale(.95); }
    }
    #promo-motion .grid {
      position: absolute;
      inset: -50%;
      background-image:
        linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
      background-size: 64px 64px;
      transform: rotate(-8deg);
      animation: promo-grid 40s linear infinite;
    }
    @keyframes promo-grid { to { background-position: 640px 640px; } }

    /* Uygulamanın ne yaptığını anlatan yüzen rozetler */
    .promo-chip {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.18);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      box-shadow: 0 12px 30px rgba(0,0,0,.28);
      animation: promo-float 7s ease-in-out infinite;
    }
    .promo-chip svg { width: 18px; height: 18px; flex: none; }
    .promo-chip.c1 { left: 7%;  top: 16%; animation-delay: -.4s; }
    .promo-chip.c2 { right: 8%; top: 24%; animation-delay: -2.1s; }
    .promo-chip.c3 { left: 11%; bottom: 20%; animation-delay: -3.6s; }
    .promo-chip.c4 { right: 9%; bottom: 16%; animation-delay: -5.2s; }
    .promo-chip.c5 { left: 46%; top: 8%;  animation-delay: -1.3s; }
    @keyframes promo-float {
      0%, 100% { transform: translateY(0) rotate(-.6deg); }
      50%      { transform: translateY(-16px) rotate(.6deg); }
    }

    /* --- İçerik --- */
    .promo-content {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 720px;
      /* Ekranın tamamını kaplar ki tanıtım yazıları en üste, indirme ve
         devam düğmeleri en alta yaslansın. İçerik sığmazsa #promo kaydırır. */
      min-height: 100%;
      padding: 44px 24px;
      box-sizing: border-box;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
      animation: promo-rise .7s cubic-bezier(.2,.7,.3,1) both;
    }
    /* Üst blok: yazılar. Alt blok: mağaza rozetleri + "devam et". */
    .promo-top, .promo-bottom {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    @keyframes promo-rise {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: none; }
    }
    .promo-kicker {
      font-size: 12px;
      letter-spacing: 2.4px;
      text-transform: uppercase;
      font-weight: 700;
      color: rgba(255,255,255,.72);
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.22);
      background: rgba(255,255,255,.07);
      margin-bottom: 22px;
    }
    #promo-headline {
      margin: 0;
      font-size: clamp(44px, 9vw, 88px);
      line-height: 1.02;
      font-weight: 900;
      letter-spacing: -2px;
      text-shadow: 0 6px 40px rgba(0,0,0,.45);
    }
    #promo-tagline {
      margin: 14px 0 0;
      font-size: clamp(19px, 3.4vw, 30px);
      font-weight: 600;
      color: rgba(255,255,255,.94);
      text-shadow: 0 3px 24px rgba(0,0,0,.45);
    }
    /* --- Dönen tanıtım maddeleri --- */
    /* Kutu SABİT yükseklikte: maddeler arasında geçiş olurken altındaki
       düğmeler zıplamasın diye yükseklik içeriğe göre değişmiyor. */
    #promo-rotator {
      position: relative;
      width: 100%;
      height: 2.1em;
      margin-top: 16px;
      font-size: clamp(15px, 2.2vw, 19px);
      font-weight: 600;
    }
    #promo-rotator[hidden] { display: none; }
    .promo-line {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      opacity: 0;
      transform: translateY(70%);
      color: rgba(255,255,255,.92);
      text-shadow: 0 2px 18px rgba(0,0,0,.45);
      transition: opacity .42s ease, transform .52s cubic-bezier(.2,.8,.2,1);
      pointer-events: none;
    }
    .promo-line.is-active { opacity: 1; transform: none; }
    .promo-line.is-leaving { opacity: 0; transform: translateY(-70%); }
    .promo-line svg {
      width: 1.05em;
      height: 1.05em;
      flex: none;
      color: #26E07F;
    }

    .promo-rule {
      width: 72px;
      height: 4px;
      border-radius: 999px;
      margin: 26px 0 0;
      overflow: hidden;
      background: linear-gradient(90deg, #00C853, #26E07F);
    }
    /* Madde varken çizgi bir İLERLEME çubuğuna dönüşür: sıradaki maddenin
       ne zaman geleceğini gösterir ve şeride sürekli bir hareket katar. */
    #promo.has-rotator .promo-rule {
      width: 132px;
      background: rgba(255,255,255,.20);
    }
    #promo-progress {
      display: block;
      height: 100%;
      width: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, #00C853, #26E07F);
    }
    #promo:not(.has-rotator) #promo-progress { display: none; }
    @keyframes promo-progress { from { width: 0; } to { width: 100%; } }

    /* --- Mağaza butonları --- */
    .promo-stores {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
    }
    .promo-badge {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      min-width: 196px;
      padding: 11px 20px;
      border-radius: 14px;
      background: #000;
      border: 1px solid rgba(255,255,255,.32);
      color: #fff;
      text-decoration: none;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
      box-shadow: 0 10px 26px rgba(0,0,0,.38);
    }
    .promo-badge:hover {
      transform: translateY(-2px);
      border-color: rgba(255,255,255,.6);
      box-shadow: 0 16px 34px rgba(0,0,0,.46);
    }
    .promo-badge svg { width: 26px; height: 26px; flex: none; }
    .promo-badge .bt { display: flex; flex-direction: column; line-height: 1.15; text-align: left; }
    .promo-badge .bt small { font-size: 10px; letter-spacing: .6px; text-transform: uppercase; opacity: .78; }
    .promo-badge .bt b { font-size: 18px; font-weight: 600; letter-spacing: .2px; }
    /* Mağaza adresi girilmemişse buton "Yakında" olarak pasifleşir */
    .promo-badge.soon { opacity: .5; pointer-events: none; }

    /* --- Webte devam et --- */
    #promo-continue {
      margin-top: 22px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 13px 26px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.34);
      background: rgba(255,255,255,.10);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #fff;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background .18s ease, transform .18s ease, border-color .18s ease;
    }
    #promo-continue:hover { background: rgba(255,255,255,.2); border-color: rgba(255,255,255,.6); transform: translateY(-1px); }
    #promo-continue:disabled { cursor: progress; opacity: .8; transform: none; }
    #promo-continue .arrow { transition: transform .18s ease; }
    #promo-continue:hover .arrow { transform: translateX(4px); }
    #promo-continue .spinner {
      width: 15px; height: 15px;
      border: 2px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      display: none;
    }
    #promo-continue.loading .spinner { display: inline-block; }
    #promo-continue.loading .arrow { display: none; }
    /* Admin düğmeyi kapattıysa: display:inline-flex, [hidden]'ı ezdiği için
       gizlemeyi ayrıca yazmak gerekiyor. */
    #promo-continue[hidden] { display: none; }

    /* --- Ses aç/kapat --- */
    #promo-sound {
      position: absolute;
      right: 18px;
      bottom: 18px;
      z-index: 3;
      width: 46px;
      height: 46px;
      display: none;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.28);
      background: rgba(0,0,0,.42);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #fff;
      cursor: pointer;
    }
    #promo.has-video #promo-sound { display: flex; }
    #promo-sound svg { width: 20px; height: 20px; }

    @media (max-width: 560px) {
      .promo-content { padding: 36px 20px; gap: 20px; }
      /* Sağ alttaki ses düğmesi alt bloğun üzerine binmesin. */
      #promo.has-video .promo-content { padding-bottom: 84px; }
      .promo-kicker { font-size: 10.5px; letter-spacing: 1.4px; }
      .promo-badge { min-width: 0; flex: 1 1 100%; justify-content: center; }
      .promo-chip.c2, .promo-chip.c4, .promo-chip.c5 { display: none; }
      .promo-chip.c1 { left: 4%; top: 10%; }
      .promo-chip.c3 { left: 6%; bottom: 12%; }
    }

    @media (prefers-reduced-motion: reduce) {
      #promo, .promo-content, #promo-motion .blob, #promo-motion .grid,
      .promo-chip, .promo-line, #promo-progress {
        animation: none !important;
        transition: none !important;
      }
      /* Hareket istenmiyorsa maddeler kaymadan, olduğu yerde değişir. */
      .promo-line { transform: none !important; }
      #promo-progress { width: 100% !important; }
    }
  </style>

  <div id="promo" hidden>

      <video id="promo-video" muted loop playsinline autoplay preload="auto" tabindex="-1"></video>

    // Ayarlar okunamazsa (çevrimdışı, RLS değişikliği, ilk ziyaret) tanıtım

    // localStorage bazı tarayıcılarda (gizli sekme, site verisi kapalı)

    function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
    function lsSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { /* yoksay */ } }

    // Tanıtım yalnızca kök adreste açılır; /u/@kullanici, /s/dukkan,

    function pathAllowsPromo() {
      var p = (window.location.pathname || '/').replace(/\/+$/, '');
      return p === '' || p === '/index.html' || p === '/tanitim';
    }

    function queryFlag() {
      var m = /[?&]promo=([^&]+)/.exec(window.location.search || '');
      return m ? decodeURIComponent(m[1]) : null;
    }

    function shouldShow(cfg) {
      var flag = queryFlag();
      if (flag === '0' || flag === 'off') return false;
      if (flag === '1' || flag === 'on') return true;      // önizleme: her zaman göster
      if (!pathAllowsPromo()) return false;
      if (!isTruthy(cfg.enabled)) return false;
      if (String(cfg.show_mode) === 'always') return true;
      return lsGet(SEEN_KEY + String(cfg.version)) !== '1';
    }

    function readCache() {
      try {
        var raw = lsGet(CACHE_KEY);
        if (!raw) return null;
        var parsed = JSON.parse(raw);
        return (parsed && typeof parsed === 'object') ? parsed : null;
      } catch (e) { return null; }
    }

    function merge(base, extra) {
      var out = {}, k;
      for (k in base) if (Object.prototype.hasOwnProperty.call(base, k)) out[k] = base[k];
      if (extra) for (k in extra) if (Object.prototype.hasOwnProperty.call(extra, k)) {
        if (extra[k] !== null && extra[k] !== undefined) out[k] = extra[k];
      }
      return out;
    }


    // --- Dönen tanıtım maddeleri ------------------------------------------
    // Maddeler admin panelinden gelir (her satır bir madde). Hepsi DOM'da
    // durur, yalnızca hangisinin görünür olduğu değişir: böylece arama
    // motorları ve ekran okuyucular maddelerin TAMAMINI görür, JavaScript
    // çalışmasa bile içerik kaybolmaz.
    var rotatorTimer = null;
    var rotatorLines = [];
    var rotatorPrev = -1;

    // Ayar hem dizi (yerleşik varsayılan) hem de satır satır tek metin
    // (Supabase) olarak gelebilir.
    function splitLines(value) {
      var raw;
      if (Object.prototype.toString.call(value) === '[object Array]') {
        raw = value;
      } else {
        raw = String(value == null ? '' : value).split(/\r?\n/);
      }
      var out = [];
      for (var i = 0; i < raw.length; i++) {
        var line = String(raw[i]).trim();
        if (line) out.push(line);
      }
      return out;
    }

    function stopRotator() {
      if (rotatorTimer) {
        window.clearInterval(rotatorTimer);
        rotatorTimer = null;
      }
    }

    function setRotator(cfg) {
      var box = document.getElementById('promo-rotator');
      if (!box) return;

      var lines = splitLines(cfg.rotating_lines);

      // Aynı maddeler zaten DÖNÜYORSA hiç dokunma: applyConfig iki kez
      // çağrılıyor (önce önbellek, sonra canlı ayarlar) ve buradan erken
      // çıkarken zamanlayıcıyı durdurmuş olsaydık şerit ilk maddede
      // kalırdı — durdurma bu yüzden kontrolden SONRA yapılır.
      if (lines.join('|') === rotatorLines.join('|') && box.children.length) {
        return;
      }

      stopRotator();
      rotatorLines = lines;
      rotatorPrev = -1;
      while (box.firstChild) box.removeChild(box.firstChild);

      if (!lines.length) {
        box.hidden = true;
        el.classList.remove('has-rotator');
        return;
      }

      for (var i = 0; i < lines.length; i++) {
        var row = document.createElement('div');
        row.className = 'promo-line';
        // İkon sabit; metin ASLA innerHTML ile yazılmaz — admin'in girdiği
        // yazı HTML olarak yorumlanmamalı.
        var icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        icon.setAttribute('viewBox', '0 0 24 24');
        icon.setAttribute('fill', 'none');
        icon.setAttribute('stroke', 'currentColor');
        icon.setAttribute('stroke-width', '2.4');
        icon.setAttribute('stroke-linecap', 'round');
        icon.setAttribute('stroke-linejoin', 'round');
        icon.setAttribute('aria-hidden', 'true');
        var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', 'M20 6L9 17l-5-5');
        icon.appendChild(path);
        var text = document.createElement('span');
        text.textContent = lines[i];
        row.appendChild(icon);
        row.appendChild(text);
        box.appendChild(row);
      }

      box.hidden = false;
      el.classList.add('has-rotator');

      var ms = parseInt(cfg.rotate_ms, 10);
      if (!isFinite(ms)) ms = 2600;
      if (ms < 1200) ms = 1200;
      if (ms > 10000) ms = 10000;

      showRotatorLine(0, ms);
      if (lines.length > 1) {
        var index = 0;
        rotatorTimer = window.setInterval(function () {
          index = (index + 1) % rotatorLines.length;
          showRotatorLine(index, ms);
        }, ms);
      }
    }

    function showRotatorLine(next, ms) {
      var box = document.getElementById('promo-rotator');
      if (!box) return;
      var kids = box.children;
      for (var k = 0; k < kids.length; k++) {
        var cls = 'promo-line';
        if (k === next) cls += ' is-active';
        else if (k === rotatorPrev) cls += ' is-leaving';
        kids[k].className = cls;
      }
      rotatorPrev = next;

      // İlerleme çubuğunu baştan başlat. Animasyonu yeniden tetiklemek için
      // arada bir reflow ZORUNLU; yoksa tarayıcı aynı animasyonu sürdürür.
      var bar = document.getElementById('promo-progress');
      if (bar) {
        bar.style.animation = 'none';
        void bar.offsetWidth;
        bar.style.animation = 'promo-progress ' + ms + 'ms linear';
      }
    }

    // --- Uygulama (DOM'a yazma) ------------------------------------------
    function applyConfig(cfg) {
      currentVersion = String(cfg.version || '1');

      var h = document.getElementById('promo-headline');
      var t = document.getElementById('promo-tagline');
      var c = document.getElementById('promo-continue-text');
      if (cfg.headline) h.textContent = cfg.headline;
      if (cfg.tagline) t.textContent = cfg.tagline;
      if (cfg.continue_text) c.textContent = cfg.continue_text;

      // Admin "Webte devam et"i gizleyebilir: o zaman tanıtım ekranı kalıcı
      // iniş sayfası olur, ziyaretçi yalnızca mağazalara yönlendirilir.
      // (Derin bağlantılar ve ?promo=0 yine uygulamayı açar.)
      var cont = document.getElementById('promo-continue');
      cont.hidden = !isTruthy(cfg.continue_enabled);

      setRotator(cfg);

      setStore('promo-play', cfg.playstore_url);
      setStore('promo-ios', cfg.appstore_url);

      var poster = String(cfg.poster_url || '');
      var img = document.getElementById('promo-poster');
      if (poster) {
        img.src = poster;
        el.classList.add('has-poster');
      } else {
        el.classList.remove('has-poster');

      var src = String(cfg.video_url || '');
      var video = document.getElementById('promo-video');
      if (src && video.getAttribute('src') !== src) {
        if (poster) video.setAttribute('poster', poster);
        video.setAttribute('src', src);
        video.load();
      } else if (!src) {
        el.classList.remove('has-video');
      }
    }

    function setStore(id, url) {
      var a = document.getElementById(id);
      var link = String(url || '').trim();
      if (link) {
        a.href = link;
        a.classList.remove('soon');

        a.removeAttribute('href');
        a.classList.add('soon');
        a.setAttribute('aria-disabled', 'true');
        a.querySelector('small').textContent = 'Yakında';

    });

    // --- Göster / kapat ---------------------------------------------------
    function show() {
      if (shown) return;
      shown = true;
      el.hidden = false;
      // Tanıtım ekranı açıkken jenerik yükleme göstergesi gereksiz.
      var loading = document.getElementById('loading');
      if (loading) loading.classList.add('hidden');
    }

    function enterApp() {
      lsSet(SEEN_KEY + currentVersion, '1');
      var btn = document.getElementById('promo-continue');
      if (!flutterReady) {
        // Flutter henüz ilk kareyi çizmedi: butonu bekleme durumuna al ve
        // hazır olunca otomatik geç. Boş beyaz ekran gösterilmez.
        pendingEnter = true;
        btn.disabled = true;
        btn.classList.add('loading');
        return;
      }
      dismiss();
    }

    function dismiss() {
      dismissed = true;
      stopRotator();
      el.classList.add('promo-leaving');

      flutterReady = true;

    (function fetchConfig() {
      if (typeof window.fetch !== 'function') return;
      // ZAMAN AŞIMI CÖMERT OLMALI. Bu istek, ~9 MB'lık Flutter paketiyle AYNI
      // ANDA iniyor; dar bantta birkaç saniye sürmesi normaldir. Süre kısa
      // tutulduğunda istek iptal ediliyor, ziyaretçi videoyu ve admin'in
      // yazdığı metinleri HİÇ görmüyor, üstelik önbelleğe de bir şey
      // yazılmadığı için bu her ziyarette tekrarlanıyordu. Beklemenin bir
      // maliyeti yok: ekran zaten varsayılanlarla çizilmiş durumda ve
      // ziyaretçi "Webte devam et"e basana kadar açık kalıyor.
      var ctrl = null, timer = null;
      try {
        ctrl = new AbortController();
        timer = window.setTimeout(function () { ctrl.abort(); }, 20000);
      } catch (e) { ctrl = null; }

      var url = SUPABASE_URL + '/rest/v1/app_settings?select=key,value&key=like.web_promo_%25';
      window.fetch(url, {
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY },
        // Tanıtım ekranının içeriği, arka planda inen uygulama paketinden
        // daha acildir: ziyaretçinin ŞU AN baktığı şey bu.
        priority: 'high',
        signal: ctrl ? ctrl.signal : undefined
      }).then(function (r) {
        return r.ok ? r.json() : null;
      }).then(function (rows) {
        if (timer) window.clearTimeout(timer);
        if (!rows || !rows.length) return;

        var fresh = {};
        for (var i = 0; i < rows.length; i++) {
          var key = String(rows[i].key || '').replace(/^web_promo_/, '');
          var val = rows[i].value;
          fresh[key] = (val === null || val === undefined) ? '' : String(val);
        }
        var cfg = merge(DEFAULTS, fresh);
        lsSet(CACHE_KEY, JSON.stringify(cfg));

        // Ziyaretçi tanıtımı çoktan kapattıysa geç gelen ayarları uygulamak
        // boşuna iş: gizli bir ekrana video yükleyip zamanlayıcı başlatır.
        if (dismissed) return;

        if (shown) {
          if (!shouldShow(cfg) && queryFlag() !== '1') {
            // Admin tanıtımı kapatmışsa açık kalan ekranı hemen kaldır.
            lsSet(SEEN_KEY + String(cfg.version), '1');
            dismiss();
            return;
          }
          applyConfig(cfg);
        } else if (shouldShow(cfg)) {
          // Sürüm artırılmış ya da tanıtım yeni açılmış olabilir.
          applyConfig(cfg);
          show();
        } else {
          currentVersion = String(cfg.version || '1');
        }
      }).catch(function () {
        if (timer) window.clearTimeout(timer);
        // Ayarlar okunamadı: varsayılanlarla gösterilen ekran olduğu gibi kalır.
      });
    })();

                if (token) {
                  console.log('[App] FCM Token:', token);
                  localStorage.setItem('fcmToken', token);
                  
                  // Token değiştiğinde güncelle
                  messaging.onTokenRefresh(async () => {

          messaging.onMessage((payload) => {

            const notificationTitle = payload.notification?.title || 'CizreApp';

            new Notification(notificationTitle, notificationOptions);

    function registerHtmlIframeFactory() {

      if (typeof _flutter !== 'undefined' && _flutter.platformViewRegistry) {
        // HTML iframe factory kaydet
        const factory = (viewId) => {

    // Yükleme göstergesini yönet

      preventScrollOnFlutterView();
    });
    
    // Flutter view üzerinde tarayıcı scrollunu engelle
    function preventScrollOnFlutterView() {
      // Ana document scroll'unu engelle
      document.addEventListener('scroll', function(e) {
        window.scrollTo(0, 0);
        document.documentElement.scrollTop = 0;
        document.body.scrollTop = 0;
      }, { passive: false });
      
      // Touchmove ile tarayıcı scrollunu engelle (sadece body/html seviyesinde)
      document.addEventListener('touchmove', function(e) {
        // Flutter canvas içindeki scroll'lara dokunma
        if (e.target.tagName === 'FLT-GLASS-PANE' ||
            e.target.tagName === 'FLUTTER-VIEW' ||
            e.target.closest('flutter-view') ||
            e.target.closest('flt-glass-pane')) {
          // Flutter'ın kendi scroll mekanizmasına izin ver
          return true;
        }
      }, { passive: true });
      
      // Klavye açıldığında viewport kaymasını engelle
      window.addEventListener('visualViewport', function() {
        // Viewport değişikliklerini izle
      });
      
      // Popstate ve hashchange'de scroll pozisyonunu sıfırla
      window.addEventListener('popstate', function() {
        window.scrollTo(0, 0);
      });
      window.addEventListener('hashchange', function() {
        window.scrollTo(0, 0);
      });
      
      // Resize sırasında scroll'u sıfırla
      window.addEventListener('resize', function() {
        window.scrollTo(0, 0);
      });
      
      // Her frame'de scroll pozisyonunu kontrol et
      setInterval(function() {
        if (window.scrollY !== 0 || document.documentElement.scrollTop !== 0) {
          window.scrollTo(0, 0);
          document.documentElement.scrollTop = 0;
          document.body.scrollTop = 0;
        }
      }, 100);
    }
    
    // Hata yakalama - sadece kritik hatalarda göster
    window.addEventListener('error', function(e) {

        lineno: e.lineno,
        colno: e.colno,
        error: e.error
      });
      // Firebase ve harici script hatalarını yut (bunlar uygulamanın çalışmasını engellememeli)
      if (e.filename && (e.filename.includes('firebase') || e.filename.includes('http') || e.filename.includes('gstatic'))) {
        console.warn('[App] Harici script hatası yoksayıldı:', e.message);
        return;
      }
      // Script hataları için sadeceFlutter ana dosyası ise hata göster
      if (e.filename && e.filename.includes('flutter_bootstrap.js')) {
        console.error('[App] Flutter hatası:', e.message);
        // Kritik Flutter hatalarında hata göster
        if (e.message.includes('buildConfig') || e.message.includes('load')) {
          document.getElementById('loading').classList.add('hidden');

          document.getElementById('error').classList.add('show');

        return;
      }
      // Diğer hataları logla ama hata ekranı gösterme (uygulama yine de çalışabilir)
      console.warn('[App] Script hatası:', e.message);
    });

      if (String(e.reason).includes('Firebase') || String(e.reason).includes('firebase')) {

      }

    // Service worker kaydı
    if ('serviceWorker' in navigator) {

        }).then((registration) => {
          console.log('[App] Service Worker registered successfully');
        }).catch((err) => {
          console.warn('[App] Service Worker registration failed:', err);
        });
      }, { once: true });
    }
    
    // Flutter yükleme timeout kontrolü
    setTimeout(() => {
      if (typeof _flutter === 'undefined' && !window._flutter_loaded) {
        console.warn('Flutter yüklenmesi beklenenden uzun sürdü');
        document.getElementById('loading').querySelector('.loading-text').textContent = 'Dosyalar yükleniyor...';
      }
    }, 10000);
    
    // 30 saniye sonra hata göster
    setTimeout(() => {
      if (!window._flutter_loaded && !window._flutter) {
        console.error('Flutter yüklenemedi - JS dosyaları yüklenemedi');
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('error-message').textContent = 'Uygulama yüklenemedi. Lütfen sayfayı yenileyin veya tarayıcınızı güncelleyin.';
        document.getElementById('error').classList.add('show');
        
        // Debug bilgileri
        console.log('Debug bilgileri:');
        console.log('- flutter_bootstrap.js yüklendi mi:', !!document.querySelector('script[src*="flutter_bootstrap.js"]'));
        console.log('- Flutter objesi:', typeof _flutter);
        console.log('- Script yüklenme hataları:', performance.getEntriesByType('resource').filter(r => r.name.includes('flutter')));
      }
    }, 30000);
