name: Database Security Checks

on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/security-database.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/security-database.yml'
  workflow_dispatch:

jobs:
  database-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Reset database from migrations
        run: supabase db reset

      - name: Lint database
        run: supabase db lint --local --schema public --level error --fail-on error

      - name: Run pgTAP security tests
        run: supabase test db supabase/tests/database
